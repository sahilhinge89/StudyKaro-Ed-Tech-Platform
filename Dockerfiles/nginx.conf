# NGINX configuration for the StudyKaro frontend.
#
# Target image: nginxinc/nginx-unprivileged (runs as UID/GID 101, listens on 8080).
# The container root filesystem is mounted read-only in Kubernetes, so every
# runtime path used by NGINX must live on a writable volume:
#   * pid file            -> /tmp/nginx.pid      (set in the image's nginx.conf)
#   * proxy/body temp     -> /tmp/*_temp         (set in the image's nginx.conf)
#   * access/error logs   -> /dev/stdout, /dev/stderr (symlinked by the image)
#   * conf.d/default.conf -> must NOT be modified at runtime (we do not enable
#                            the image's IPv6/worker autotune entrypoint scripts)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the NGINX version.
    server_tokens off;

    # Container/ingress level liveness signal.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API traffic is proxied to the backend Service (same namespace).
  
location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend-svc:4000;
    proxy_pass $backend;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}




    # Hashed build assets can be cached aggressively, index.html must not be.
    location /static/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Security headers applied to every response.
    #
    # They live in a separate file because NGINX only inherits `add_header`
    # directives from the parent level when the child level does not define
    # any itself. The `location` blocks above add their own Cache-Control
    # header, so they have to include this snippet explicitly.
    include /etc/nginx/snippets/security-headers.conf;
}
