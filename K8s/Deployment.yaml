# StudyKaro - hardened Kubernetes manifests
#
# Every container in this stack:
#   * runs as a non-root user (securityContext.runAsNonRoot)
#   * has a read-only root filesystem (securityContext.readOnlyRootFilesystem)
#   * drops all Linux capabilities and disables privilege escalation
#   * mounts explicit emptyDir volumes for the few paths that must be writable
#
# Images are pushed by Jenkins to Docker Hub with an auto-incremented tag
# (1.1.1, 1.1.2, ...). The Jenkins "Deploy to Kubernetes" stage updates the
# running Deployments with `kubectl set image`, so the tags below are only the
# initial version used on the very first apply.
#
# Apply order:
#   kubectl apply -f K8s/Deployment.yaml
#   kubectl apply -f K8s/Service.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: studykaro
  labels:
    app.kubernetes.io/part-of: studykaro
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Non-sensitive backend configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: studykaro-backend-config
  namespace: studykaro
data:
  NODE_ENV: production
  PORT: "4000"
  # Cloudinary folder used to store course media.
  FOLDER_NAME: studykaro
  # Number of reverse proxies in front of the API. 1 = the NGINX container in
  # this pod / the Ingress controller. Required so `secure` cookies and the
  # real client IP are resolved correctly from X-Forwarded-* headers.
  TRUST_PROXY: "1"
  # Comma separated list of browser origins allowed to send credentialed
  # requests. Same-origin requests (no Origin header) are always allowed, so
  # this only matters when the SPA is served from a different host.
  # REPLACE_ME with the production origin(s), e.g. "https://studykaro.example.com"
  CLIENT_ORIGINS: "REPLACE_ME"
  # The auth cookie is issued with SameSite=Lax by default, which is enough
  # for the same-origin /api proxy. Set to "none" (and keep COOKIE_SECURE
  # true) only when the SPA runs on a different site than the API.
  COOKIE_SAME_SITE: "lax"
  # Marks the auth cookie as "Secure". Enabled automatically for HTTPS
  # requests; set explicitly to "true" to force it on.
  COOKIE_SECURE: "true"

---
# TEMPLATE SECRET - replace the placeholders before applying, or delete this
# object and create the secret out of band:
#   kubectl -n studykaro create secret generic studykaro-backend-secrets \
#     --from-literal=JWT_SECRET=... --from-literal=MONGODB_URL=... ...
# Never commit real secret values to Git.
apiVersion: v1
kind: Secret
metadata:
  name: studykaro-backend-secrets
  namespace: studykaro
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  MONGODB_URL: "mongodb+srv://REPLACE_ME"
  MAIL_HOST: "REPLACE_ME"
  MAIL_USER: "REPLACE_ME"
  MAIL_PASS: "REPLACE_ME"
  CLOUD_NAME: "REPLACE_ME"
  API_KEY: "REPLACE_ME"
  API_SECRET: "REPLACE_ME"
  RAZORPAY_KEY: "REPLACE_ME"
  RAZORPAY_SECRET: "REPLACE_ME"

---
# Backend API (Node/Express).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studykaro-backend
  namespace: studykaro
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: studykaro
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: studykaro
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Uncomment if the Docker Hub repository is private:
      # kubectl -n studykaro create secret docker-registry dockerhub-secret \
      #   --docker-username=hackerboypk --docker-password=<token>
      # imagePullSecrets:
      #   - name: dockerhub-secret
      containers:
        - name: backend
          # Tag is bumped automatically by Jenkins (1.1.1 -> 1.1.2 -> ...)
          image: hackerboypk/studykaro-backend:1.1.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: studykaro-backend-config
            - secretRef:
                name: studykaro-backend-secrets
          env:
            # TMPDIR points express-fileupload at the writable tmp volume.
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            # express-fileupload writes temporary uploads here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

---
# Frontend SPA served by NGINX (unprivileged image, UID 101).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studykaro-frontend
  namespace: studykaro
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: studykaro
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: studykaro
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Uncomment if the Docker Hub repository is private (see backend above).
      # imagePullSecrets:
      #   - name: dockerhub-secret
      containers:
        - name: frontend
          # Tag is bumped automatically by Jenkins (1.1.1 -> 1.1.2 -> ...)
          image: hackerboypk/studykaro:1.1.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The image's entrypoint scripts only rewrite /etc/nginx/nginx.conf
            # when these are enabled; keep them off so the read-only root
            # filesystem stays untouched.
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "0"
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # /readyz additionally verifies the MongoDB connection, so traffic
            # is only routed to pods that can actually serve requests.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give the load balancer time to remove this pod from its
                # endpoints before the process starts shutting down.
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            # pid file + proxy/client temp paths must stay writable.
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
