
apiVersion: v1
kind: ConfigMap
metadata:
  name: studykaro-backend-config
  namespace: studykaro
data:
  NODE_ENV: production
  PORT: "4000"
  FOLDER_NAME: studykaro
  TRUST_PROXY: "1"
  # Replace with the production frontend origin(s) before deploying.
  CLIENT_ORIGINS: "REPLACE_ME"
  COOKIE_SAME_SITE: "lax"
  COOKIE_SECURE: "true"
  # Frontend Service type: "NodePort" or "LoadBalancer". Set via env FRONTEND_SVC_TYPE.
  FRONTEND_SERVICE_TYPE: "NodePort"
  FRONTEND_NODE_PORT: "30080"
