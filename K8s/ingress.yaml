apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studykaro
  namespace: studykaro
  labels:
    app.kubernetes.io/part-of: studykaro
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - studykaro.example.com
  #     secretName: studykaro-tls
  rules:
    - host: studykaro.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  name: http
