# ============================================================================
# HAProxy Ingress Controller — StudyKaro
# Static configuration mounted into the haproxy DaemonSet pods.
# Routes external traffic to internal ClusterIP services.
# ============================================================================

global
    daemon
    maxconn 4096
    log /dev/log local0 info
    log /dev/log local0 notice

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout tunnel 50s
    retries 3

# ---------------------------------------------------------------------------
# Frontend: accept HTTP traffic on port 80
# ---------------------------------------------------------------------------
frontend http-in
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/studykaro.pem  # optional TLS; comment out if not using certs

    # Route API traffic directly to the backend service
    acl is_api path_beg /api/
    use_backend backend_pool if is_api

    # Default: route to the frontend (SPA + NGINX proxy)
    default_backend frontend_pool

# ---------------------------------------------------------------------------
# Backend: Express API (ClusterIP)
# ---------------------------------------------------------------------------
backend backend_pool
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server backend backend-svc.studykaro.svc.cluster.local:4000 check inter 30s rise 2 fall 3

# ---------------------------------------------------------------------------
# Frontend: React SPA served by NGINX (ClusterIP)
# ---------------------------------------------------------------------------
backend frontend_pool
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server frontend frontend-svc.studykaro.svc.cluster.local:80 check inter 30s rise 2 fall 3

# ---------------------------------------------------------------------------
# Stats endpoint (optional, internal only)
# ---------------------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats auth admin:CHANGE_ME