# ============================================================================
# HAProxy Ingress Controller — StudyKaro
# Deployed as a DaemonSet so every node runs an HAProxy ingress instance.
# External traffic reaches the controller via the NodePort service below.
#
# Apply:  kubectl apply -f K8s/haproxy-ingress-deploy.yaml -n studykaro
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: studykaro
  labels:
    app.kubernetes.io/part-of: studykaro
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haproxy-ingress
  namespace: studykaro
  labels:
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/part-of: studykaro

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haproxy-ingress
  labels:
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/part-of: studykaro
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "configmaps", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haproxy-ingress
  labels:
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/part-of: studykaro
subjects:
  - kind: ServiceAccount
    name: haproxy-ingress
    namespace: studykaro
roleRef:
  kind: ClusterRole
  name: haproxy-ingress
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-ingress-config
  namespace: studykaro
  labels:
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/part-of: studykaro
data:
  haproxy.cfg: |
    global
        daemon
        maxconn 4096
        log /dev/log local0 info

    defaults
        mode http
        log global
        option httplog
        option dontlognull
        option http-server-close
        timeout connect 5s
        timeout client 50s
        timeout server 50s
        timeout tunnel 50s
        retries 3

    frontend http-in
        bind *:80
        acl is_api path_beg /api/
        use_backend backend_pool if is_api
        default_backend frontend_pool

    backend backend_pool
        mode http
        balance roundrobin
        option httpchk GET /healthz
        http-check expect status 200
        server backend backend-svc.studykaro.svc.cluster.local:4000 check inter 30s rise 2 fall 3

    backend frontend_pool
        mode http
        balance roundrobin
        option httpchk GET /healthz
        http-check expect status 200
        server frontend frontend-svc.studykaro.svc.cluster.local:80 check inter 30s rise 2 fall 3

    listen stats
        bind *:8404
        mode http
        stats enable
        stats uri /
        stats auth admin:CHANGE_ME

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: haproxy-ingress
  namespace: studykaro
  labels:
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/part-of: studykaro
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy-ingress
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy-ingress
        app.kubernetes.io/part-of: studykaro
    spec:
      serviceAccountName: haproxy-ingress
      terminationGracePeriodSeconds: 30
      containers:
        - name: haproxy
          image: haproxy:2.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: stats
              containerPort: 8404
              protocol: TCP
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-ingress-config

---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-ingress
  namespace: studykaro
  labels:
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/part-of: studykaro
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: haproxy-ingress
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32001
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      nodePort: 32002
      protocol: TCP
    - name: stats
      port: 8404
      targetPort: stats
      nodePort: 32003
      protocol: TCP